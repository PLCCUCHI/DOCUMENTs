<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDI Center — CMIT Customer Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1F3D;
    --navy-hover: #16305A;
    --navy-active: #132A4D;
    --green: #7FE52E;
    --text-light: #F5F4F0;
    --text-side-muted: #8A94A6;
    --bg-page: #E8E6E0;
    --bg-main: #F5F4F0;
    --bg-card: #FFFFFF;
    --border-card: #E0DDD5;
    --border-input: #C9C6BE;
    --text-navy: #0A1F3D;
    --text-muted: #6B7280;
    --text-muted2: #8A8578;
    --text-body: #2A3242;
    --link-blue: #2F6FD0;
    --danger: #D6453D;
    --neutral-badge: #8A94A6;
    --chip-bg: #ECEAE3;
    --chip-border: #DCD8CF;
    --error-border: #E7C4C1;
    --error-bg: #FCF6F5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: var(--bg-page);
    color: var(--text-navy);
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--navy-hover); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app-shell {
    width: 100%;
    height: 100vh;
    display: flex;
    background: var(--bg-main);
    overflow: hidden;
    position: relative;
  }

  /* ---------- Sidebar (expanded) ---------- */
  .sidebar {
    width: 260px;
    flex: none;
    background: var(--navy);
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .sidebar-header {
    padding: 14px 12px 14px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--navy-hover);
    flex: none;
  }
  .sidebar-title { flex: 1; color: var(--text-light); font-size: 14px; font-weight: 600; }
  .lang-toggle { display: flex; align-items: center; background: var(--navy-active); border-radius: 4px; padding: 2px; }
  .lang-btn {
    font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 3px;
    color: var(--text-side-muted); cursor: pointer; border: none; background: transparent;
    font-family: inherit;
  }
  .lang-btn.active { background: #2A4570; color: var(--text-light); }
  .lang-btn:not(.active):hover { color: var(--text-light); }

  .collapse-btn {
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    color: var(--text-side-muted); cursor: pointer; border-radius: 4px; background: none; border: none;
  }
  .collapse-btn:hover { background: var(--navy-hover); color: var(--text-light); }

  .nav-scroll { flex: 1; overflow-y: auto; padding: 4px 0 8px; }

  .group-header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    font-size: 14px; cursor: pointer; white-space: nowrap; outline: none;
    border: none; background: none; width: 100%; text-align: left; font-family: inherit;
  }
  .group-header.is-open { color: var(--text-light); font-weight: 600; }
  .group-header.is-closed { color: var(--text-side-muted); }
  .group-header:hover { background: var(--navy-hover); }
  .group-header:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }
  .group-header .g-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .group-caret { color: var(--text-side-muted); font-size: 9px; flex: none; }

  .rollup-badge {
    font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 9px; flex: none;
  }
  .rollup-badge.danger { background: var(--danger); color: var(--text-light); }
  .rollup-badge.neutral { background: var(--neutral-badge); color: var(--navy); }

  .item-row {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 6px 10px 24px; color: var(--text-light); font-size: 14px;
    cursor: pointer; white-space: nowrap; outline: none; border: none; background: none;
    width: 100%; text-align: left; font-family: inherit;
  }
  .item-row:hover { background: var(--navy-hover); }
  .item-row:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }
  .item-row.active {
    padding-left: 21px; background: var(--navy-active); border-left: 3px solid var(--green); color: var(--green);
  }
  .item-row .i-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .item-badge { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 9px; flex: none; }
  .item-badge.danger { background: var(--danger); color: var(--text-light); }
  .item-badge.neutral { background: var(--neutral-badge); color: var(--navy); }

  .group-gap { height: 16px; }

  /* ---------- Sidebar (collapsed rail) ---------- */
  .rail {
    width: 64px; flex: none; background: var(--navy); display: flex; flex-direction: column;
    height: 100%; position: relative; z-index: 2;
  }
  .rail-header {
    height: 53px; flex: none; display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--navy-hover); color: var(--text-light); font-size: 13px; font-weight: 700;
    cursor: pointer; border: none; background: none; width: 100%; font-family: inherit;
  }
  .rail-header:hover { background: var(--navy-hover); }
  .rail-scroll { flex: 1; overflow-y: auto; padding: 4px 0; }
  .rail-item {
    height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: none; background: none; width: 100%; position: relative;
  }
  .rail-item:hover { background: var(--navy-hover); }
  .rail-item.active { background: var(--navy-active); border-left: 3px solid var(--green); }

  .flyout {
    position: absolute; left: 64px; top: 53px; width: 260px; background: var(--navy);
    border-left: 1px solid var(--navy-hover); box-shadow: 8px 0 22px rgba(10,31,61,0.28); z-index: 3;
  }
  .flyout-title {
    padding: 14px 16px 12px; color: var(--text-light); font-size: 14px; font-weight: 600;
    border-bottom: 1px solid var(--navy-hover); white-space: nowrap;
  }
  .flyout-list { padding: 6px 0 8px; }
  .flyout-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px 10px 16px; color: var(--text-light);
    font-size: 14px; cursor: pointer; white-space: nowrap; border: none; background: none; width: 100%;
    text-align: left; font-family: inherit;
  }
  .flyout-item:hover { background: var(--navy-hover); }
  .flyout-item.active { padding-left: 13px; background: var(--navy-active); border-left: 3px solid var(--green); color: var(--green); }
  .flyout-item .i-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Main pane ---------- */
  .main-pane { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  .breadcrumb {
    padding: 16px 24px 0; display: flex; align-items: center; gap: 8px; font-size: 13px;
    color: var(--text-muted); white-space: nowrap; flex: none;
  }
  .breadcrumb .sep { color: #B6B2A8; }
  .breadcrumb .current { color: var(--text-navy); font-weight: 500; }

  .page-title-row { padding: 10px 24px 0; display: flex; align-items: center; gap: 10px; flex: none; }
  .page-title { font-size: 20px; font-weight: 600; color: var(--text-navy); }

  .filter-card {
    margin: 12px 24px 0; background: var(--bg-card); border: 1px solid var(--border-card);
    border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; flex: none;
  }
  .filter-row { display: flex; align-items: flex-end; gap: 10px; }
  .filter-grid { flex: 1; display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 10px; }
  .filter-grid.secondary { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
  .filter-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .filter-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted2); }
  .filter-input {
    height: 30px; border: 1px solid var(--border-input); border-radius: 3px; background: #FDFCFA;
    display: flex; align-items: center; padding: 0 8px; font-size: 12.5px; color: var(--text-navy);
    white-space: nowrap; overflow: hidden; gap: 6px;
  }
  .filter-input .fv { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .filter-input .caret { color: var(--text-muted2); font-size: 9px; }
  .filter-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .btn {
    height: 30px; padding: 0 14px; display: flex; align-items: center; font-size: 12.5px;
    border-radius: 3px; cursor: pointer; border: 1px solid transparent; font-family: inherit;
  }
  .btn-primary { background: var(--navy); color: var(--text-light); font-weight: 500; }
  .btn-primary:hover { background: var(--navy-hover); }
  .btn-outline { border-color: var(--border-input); color: var(--text-navy); background: none; padding: 0 12px; }
  .btn-outline:hover { background: #ECEAE3; }
  .more-filters { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--link-blue); font-weight: 500; cursor: pointer; border: none; background: none; padding: 0; font-family: inherit; width: fit-content; }
  .more-filters .car { font-size: 9px; }

  .chips-row { margin: 10px 24px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 24px; flex: none; }
  .chip {
    display: flex; align-items: center; gap: 6px; background: var(--chip-bg); border: 1px solid var(--chip-border);
    border-radius: 12px; padding: 3px 8px 3px 10px; font-size: 12px; color: var(--text-body); white-space: nowrap;
  }
  .chip .x { color: var(--text-muted2); cursor: pointer; }
  .count-label { margin-left: auto; font-size: 12.5px; color: var(--text-muted); }

  .bulk-row { margin: 10px 24px 0; display: flex; align-items: center; gap: 8px; flex: none; }
  .bulk-hint { font-size: 12px; color: var(--text-muted2); }
  .bulk-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .btn-sm { height: 28px; padding: 0 12px; }

  .table-card {
    margin: 10px 24px 0; flex: 1; min-height: 0; border: 1px solid var(--border-card); border-radius: 4px;
    background: var(--bg-card); overflow: auto;
  }
  .table-grid-cols { display: grid; grid-template-columns: 104px 92px 132px 128px 100px 180px 100px 108px 1fr; }
  .table-head {
    position: sticky; top: 0; background: #F0EEE8; border-bottom: 1px solid var(--chip-border);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); z-index: 1;
  }
  .table-head > div { padding: 8px; }
  .table-head > div:first-child { padding-left: 12px; }
  .table-head > div:last-child { padding-right: 12px; }
  .table-row { border-bottom: 1px solid #EFEDE7; font-size: 12.5px; color: var(--text-body); align-items: center; }
  .table-row > div { padding: 7px 8px; }
  .table-row > div:first-child { padding-left: 12px; }
  .table-row > div:last-child { padding-right: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--link-blue); font-size: 12px; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .stack { display: flex; flex-direction: column; gap: 1px; }
  .status-pill {
    display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
    padding: 2px 7px; border-radius: 10px; color: #FFFFFF;
  }

  .pagination { margin: 0 24px; padding: 10px 0 14px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-muted); flex: none; }
  .page-size { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .page-size-box { height: 28px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-input); border-radius: 3px; color: var(--text-navy); }

  .state-card {
    margin: 10px 24px 24px; flex: 1; min-height: 0; border-radius: 4px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; padding: 32px;
  }
  .state-card.empty { border: 1px solid var(--border-card); background: var(--bg-card); }
  .state-card.error { border: 1px solid var(--error-border); background: var(--error-bg); }
  .state-title { font-size: 16px; font-weight: 600; color: var(--text-navy); text-align: center; }
  .state-body { font-size: 13px; color: var(--text-muted); text-align: center; max-width: 460px; }
  .state-err-code { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--danger); }

  .demo-bar {
    max-width: 1400px; margin: 0 auto 14px; padding: 10px 16px; display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; color: var(--text-navy);
  }
  .demo-bar select { font-family: inherit; font-size: 12.5px; padding: 4px 8px; border-radius: 3px; border: 1px solid var(--border-input); }
  .page-wrap { display: flex; flex-direction: column; height: 100vh; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="demo-bar">

    <select id="stateSelect">

      <option value="error">Lỗi tải dữ liệu</option>

  <div class="app-shell" id="app"></div>
</div>

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function svgIcon(pathKey, size, color) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="${color}" stroke-width="1.5">` +
    ICONS[pathKey].split(" M").map((p,i)=> `<path d="${i===0?p:"M"+p}"></path>`).join("") + `</svg>`;

const state = {
  lang: "vi",
  open: "Vận hành bản tin",
  sel: "/edi/messages/tracking",
  collapsed: false,
  flyout: null,
  demoState: "data"
};

function findByRoute(route) {
  for (const g of RAW) for (const it of g[5]) if (it[2] === route) return { g, it };
  return null;
}

function render() {
  const vi = state.lang === "vi";
  const app = document.getElementById("app");
  const found = findByRoute(state.sel);
  const selLabel = vi ? found.it[0] : found.it[1];
  const groupLabel = vi ? found.g[0] : found.g[1];

  let html = "";

  if (!state.collapsed) {
    html += `<div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">EDI Center</span>
        <div class="lang-toggle">
          <button class="lang-btn ${vi ? "active" : ""}" data-act="setVI">VI</button>
          <button class="lang-btn ${!vi ? "active" : ""}" data-act="setEN">EN</button>
        </div>
        <button class="collapse-btn" data-act="toggleCollapse" title="Thu gọn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.5 4 5.5 8l4 4 M12.5 3v10"></path></svg>
        </button>
      </div>
      <div class="nav-scroll">`;

    RAW.forEach((g) => {
      const items = g[5];
      const hasActive = items.some(it => it[2] === state.sel);
      const isOpen = state.open === g[0];
      const iconColor = hasActive ? "var(--green)" : "var(--text-side-muted)";
      const danger = items.reduce((s,it)=> s + (it[7]==="danger" ? Number(it[6]) : 0), 0);
      const neutral = items.reduce((s,it)=> s + (it[7]==="neutral" ? Number(it[6]) : 0), 0);

      if (isOpen) {
        html += `<div>
          <button class="group-header is-open" data-act="toggleGroup" data-group="${g[0]}">
            ${svgIcon(g[2], 16, "var(--green)")}
            <span class="g-label">${vi ? g[0] : g[1]}</span>
            <span class="group-caret">▼</span>
          </button>`;
        items.forEach(it => {
          const active = it[2] === state.sel;
          const badge = it[6] ? `<span class="item-badge ${it[7]}">${it[6]}</span>` : "";
          html += `<button class="item-row ${active ? "active" : ""}" data-act="select" data-route="${it[2]}">
            <span class="i-label">${vi ? it[0] : it[1]}</span>${badge}
          </button>`;
        });
        html += `</div>`;
      } else {
        const rollupBadge = danger > 0
          ? `<span class="rollup-badge danger">${danger}</span>`
          : (neutral > 0 ? `<span class="rollup-badge neutral">${neutral}</span>` : "");
        html += `<div>
          <button class="group-header is-closed" data-act="toggleGroup" data-group="${g[0]}">
            ${svgIcon(g[2], 16, iconColor)}
            <span class="g-label">${vi ? g[0] : g[1]}</span>
            ${rollupBadge}
            <span class="group-caret">▶</span>
          </button>
        </div>`;
      }
      if (g[4]) html += `<div class="group-gap"></div>`;
    });

    html += `</div></div>`;
  } else {
    html += `<div class="rail">
      <button class="rail-header" data-act="toggleCollapse" title="Mở rộng">EDI</button>
      <div class="rail-scroll">`;
    RAW.forEach(g => {
      const items = g[5];
      const hasActive = items.some(it => it[2] === state.sel);
      const iconColor = hasActive ? "var(--green)" : "var(--text-side-muted)";
      html += `<div>
        <button class="rail-item ${hasActive ? "active" : ""}" data-act="openFlyout" data-group="${g[0]}" title="${vi ? g[0] : g[1]}">
          ${svgIcon(g[2], 18, hasActive ? "var(--green)" : iconColor)}
        </button>
        ${g[4] ? `<div class="group-gap"></div>` : ""}
      </div>`;
    });
    html += `</div></div>`;

    if (state.flyout) {
      const g = RAW.find(x => x[0] === state.flyout);
      if (g) {
        html += `<div class="flyout">
          <div class="flyout-title">${vi ? g[0] : g[1]}</div>
          <div class="flyout-list">`;
        g[5].forEach(it => {
          const active = it[2] === state.sel;
          const badge = it[6] ? `<span class="item-badge ${it[7]}">${it[6]}</span>` : "";
          html += `<button class="flyout-item ${active ? "active" : ""}" data-act="select" data-route="${it[2]}">
            <span class="i-label">${vi ? it[0] : it[1]}</span>${badge}
          </button>`;
        });
        html += `</div></div>`;
      }
    }
  }

  html += renderMainPane(vi, groupLabel, selLabel);

  app.innerHTML = html;
  wireEvents();
}

function renderTable() {
  const rows = ROWS.map(r => ({
    time: r[0].slice(11), rel: r[1], partner: r[2], partnerFull: r[3],
    type: r[4], action: r[5], object: r[6], status: r[7], statusColor: SC[r[7]],
    errCode: r[8] || "—", reason: r[9], dispatch: r[10],
    recon: r[11], reconColor: r[11] === "Lệch 2 trường" ? "var(--danger)" : "var(--text-body)",
    file: r[12]
  }));

  const head = `<div class="table-head table-grid-cols">
    <div>Thời điểm nhận</div><div>Trading partner</div><div>Message type</div><div>Đối tượng nghiệp vụ</div>
    <div>Trạng thái</div><div>Lý do nếu bị chặn</div><div>Phát hành</div><div>Đối soát</div><div>File gốc</div>
  </div>`;

  const body = rows.map(r => `<div class="table-row table-grid-cols">
    <div class="stack"><span class="mono" style="font-size:12px;color:var(--navy)">${r.time}</span><span style="font-size:11px;color:var(--text-muted2)">${r.rel}</span></div>
    <div title="${r.partnerFull}">${r.partner}</div>
    <div class="stack"><span class="mono" style="font-size:12px;color:var(--navy)">${r.type}</span><span style="font-size:11px;color:var(--text-muted)">${r.action}</span></div>
    <div class="mono" style="font-size:12px">${r.object}</div>
    <div><span class="status-pill" style="background:${r.statusColor}">${r.status}</span></div>
    <div class="stack" style="min-width:0"><span class="mono" style="font-size:11.5px;color:var(--navy)">${r.errCode}</span><span style="font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.reason}</span></div>
    <div class="mono" style="font-size:12px;color:var(--text-body)">${r.dispatch}</div>
    <div style="font-size:12px;color:${r.reconColor}">${r.recon}</div>
    <div>${r.file}</div>
  </div>`).join("");

  return `<div class="table-card">${head}${body}</div>
  <div class="pagination">
    <div>Hiển thị 1–50 / 1.284</div>
    <div class="page-size">
      <span>Số dòng mỗi trang</span>
      <div class="page-size-box">50<span style="font-size:9px;color:var(--text-muted2)">▼</span></div>
    </div>
  </div>`;
}

function renderEmpty(title, bodyText, actionLabel) {

    <div class="state-body">${bodyText}</div>

  </div>`;
}

}

function wireEvents() {
  document.querySelectorAll("[data-act]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const act = el.dataset.act;
      if (act === "setVI") state.lang = "vi";
      else if (act === "setEN") state.lang = "en";
      else if (act === "toggleCollapse") { state.collapsed = !state.collapsed; state.flyout = null; }
      else if (act === "toggleGroup") state.open = (state.open === el.dataset.group ? null : el.dataset.group);
      else if (act === "openFlyout") state.flyout = (state.flyout === el.dataset.group ? null : el.dataset.group);
      else if (act === "select") { state.sel = el.dataset.route; state.flyout = null; }
      render();
    });
  });
  const mainPane = document.querySelector(".main-pane");
  if (mainPane) mainPane.addEventListener("click", () => { if (state.flyout) { state.flyout = null; render(); } });
}

document.getElementById("stateSelect").addEventListener("change", (e) => {
  state.demoState = e.target.value;
  render();
});

render();
</script>
</body>
</html>
